---
!bind
$Values:
  name: api
  sidecars:
    - proxy

---
!validation
$rules:
  - !is-not-empty $Values.name?
  - !or
    - !is-not-empty $Values.sidecars?
    - !is-not-empty $Values.init?
$fail: "need name and sidecars or init"

---
!emit
$when: !is-not-empty $Values.sidecars?
$yield:
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: !ref $Values.name
$else-yield: ""
